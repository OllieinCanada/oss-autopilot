name: Checklist 1796 baseline validation
on:
  push:
    branches: ['validation/checklist-1796-baseline']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @oss-autopilot/core exec vitest run src/core/checklist-analysis.test.ts -t '#1796'
